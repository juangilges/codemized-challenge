services:
  postgres:
    image: postgres:16
    container_name: codemized-postgres
    environment:
      POSTGRES_DB: codemized
      POSTGRES_USER: codemized
      POSTGRES_PASSWORD: codemized
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemized -d codemized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: codemized-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codemized
      SPRING_DATASOURCE_USERNAME: codemized
      SPRING_DATASOURCE_PASSWORD: codemized
      JWT_SECRET: codemized-super-secret-key-2026-jwt-development
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: codemized-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
services:
  postgres:
    image: postgres:16
    container_name: codemized-postgres
    environment:
      POSTGRES_DB: codemized
      POSTGRES_USER: codemized
      POSTGRES_PASSWORD: codemized
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: